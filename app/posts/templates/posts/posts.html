{% extends 'base.html' %}

{% block title %}POSTS{% endblock %}

{% block content %}

<h1 class="text-center mt-4">Articles</h1>

<div class="container mt-4">
    <div class="row">
        {% for post in posts %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text">{{ post.content[:100] }}...</p> <!-- Скорочений контент -->
                        <p class="card-text"><small class="text-muted">Author: {{ post.author }}</small></p>
                        <p class="card-text"><small class="text-muted">Category: {{ post.category }}</small></p>
                        <a href="{{ url_for('posts.detail_post', id=post.get('id')) }}" class="btn btn-primary">Read More</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
